coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
      backend:
        target: 80%
        threshold: 1%
        flags:
          - backend
      contracts:
        target: 70%
        threshold: 1%
        flags:
          - contracts
      frontend:
        target: 80%
        threshold: 1%
        flags:
          - frontend
    patch:
      default:
        target: 80%
        threshold: 1%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
